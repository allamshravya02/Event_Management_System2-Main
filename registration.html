<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Event Registration</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <!-- Navbar -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container">
        <a class="navbar-brand" href="#"> College Events </a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#menu"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link active" href="index.html">Home</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="events.html">Events</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="gallery.html">Gallery</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="registration.html">Registration</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="schedule.html">Schedule</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="faq.html">FAQs</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="contact.html">Contact</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container py-5">
      <h1 class="text-center mb-4">Event Registration</h1>

      <div class="alert alert-success">
        Fill the form and register successfully.
      </div>

      <form>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label>Student Name</label>
            <input type="text" class="form-control" />
          </div>

          <div class="col-md-6 mb-3">
            <label>Roll Number</label>
            <input type="text" class="form-control" />
          </div>

          <div class="col-md-6 mb-3">
            <label>Branch</label>
            <input type="text" class="form-control" />
          </div>

          <div class="col-md-6 mb-3">
            <label>Email</label>
            <input type="email" class="form-control" />
          </div>

          <div class="col-md-6 mb-3">
            <label>Mobile Number</label>
            <input type="tel" class="form-control" />
          </div>

          <div class="col-md-6 mb-3">
            <label>Event Selection</label>

            <select class="form-select">
              <option>Technical Quiz</option>
              <option>Hackathon</option>
              <option>Poster Presentation</option>
              <option>Coding Contest</option>
              <option>Project Expo</option>
              <option>Cultural Fest</option>
            </select>
          </div>
        </div>

        <button class="btn btn-success">Register</button>

        <button class="btn btn-danger">Reset</button>

        <button
          type="button"
          class="btn btn-primary"
          data-bs-toggle="modal"
          data-bs-target="#rulesModal"
        >
          View Event Rules
        </button>
      </form>
    </div>

    <!-- Modal -->

    <div class="modal fade" id="rulesModal">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5>Event Rules</h5>
          </div>

          <div class="modal-body">
            <ul>
              <li>Carry College ID Card</li>
              <li>Report 30 minutes before event</li>
              <li>Follow coordinator instructions</li>
            </ul>
          </div>

          <div class="modal-footer">
            <button class="btn btn-secondary" data-bs-dismiss="modal">
              Close
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
